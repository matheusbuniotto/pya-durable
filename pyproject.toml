[project]
name = "pya-durable"
version = "0.1.0"
description = "Crash-resilient, durable agent harness for PydanticAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "aiosqlite>=0.20.0",
    "pydantic-ai>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pya_durable"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
