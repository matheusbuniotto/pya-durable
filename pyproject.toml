[project]
name = "pydantic-ai-durable"
version = "0.1.0"
description = "Crash-resilient, durable agent harness for PydanticAI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matheus Buniotto" }]
keywords = ["pydantic-ai", "agents", "durable-execution", "llm", "ai-agents", "sqlite", "crash-recovery", "workflow"]
classifiers = ["Programming Language :: Python :: 3", "Framework :: Pydantic", "Topic :: Software Development :: Libraries", "Intended Audience :: Developers"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "aiosqlite>=0.20.0",
    "typing-extensions>=4.6.0",
    "pydantic-ai>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/matheusbuniotto/pydantic-ai-durable"
Issues = "https://github.com/matheusbuniotto/pydantic-ai-durable/issues"
Changelog = "https://github.com/matheusbuniotto/pydantic-ai-durable/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pya_durable", "src/pydantic_ai_durable"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C90", "SIM", "PLR0911", "PLR0912", "PLR0915"]
ignore = ["E501", "S110", "S603", "S607", "SIM105", "SIM108", "SIM117", "B027", "E731", "S106"]

[tool.ruff.lint.mccabe]
max-complexity = 40  # ratchet: lower as run_turn/_execute_task_loop get refactored

[tool.ruff.lint.pylint]
max-branches = 40
max-statements = 215
max-returns = 20

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "PLR"]
"evals/**" = ["S", "PLR"]

[tool.bandit]
exclude_dirs = ["tests", "evals"]
